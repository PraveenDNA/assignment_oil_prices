[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brent-stress"
version = "0.1.0"
description = "Synthetic Brent crude stress-test scenarios via GJR-GARCH(1,1)"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.28",
    "arch>=6.3.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "statsmodels>=0.14.0",
    "jinja2>=3.1.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

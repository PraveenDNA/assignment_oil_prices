[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brent-stress"
version = "0.1.0"
description = "Synthetic Brent crude stress-test scenarios via GJR-GARCH(1,1)"
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.3.0",
    "arch==8.0.0",
    "pandas==3.0.2",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "matplotlib==3.10.9",
    "statsmodels==0.14.6",
    "Jinja2==3.1.6",
    "python-docx==1.2.0",
    "anthropic==0.100.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]
